<!DOCTYPE html>

<head>

        }

        li {
            margin-bottom: 10px;
            line-height: 1.5;
            color: #374151;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #2563eb;
            font-weight: bold;
        }

        .ai-badge {
            display: inline-block;
            background: #eef2ff;
            color: #1e3a8a;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .button-area {
            text-align: center;
            margin: 30px 0;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            margin: 6px;

            cursor: pointer;

            font-weight: bold;
        }

        button:hover {
            background: #1d4ed8;
        }

<body>

    <div class="header">

        <h1>🎓 Placement Preparation Portal</h1>

    </div>

    <div class="container">

        <div class="page-title">

            <h2>📖 Topic Notes</h2>

            <p>
                Study important concepts and placement-focused points.
            </p>

        </div>

        <div class="info-card">

            <h3 id="companyTitle"></h3>

            <h3 id="roleTitle"></h3>

            <h3 id="topicTitle"></h3>

            <p id="topicDescription"></p>

        </div>

        <div class="notes-card">

            <div class="ai-badge">
                🤖 AI-Generated Placement Notes
            </div>

            <h2 id="notesTitle">📚 Study Notes</h2>

            <div id="loadingMessage" class="loading">
                🤖 Gemini is generating your notes...
            </div>

            <div id="notesContent" style="display:none;">

                <h3>What is this topic?</h3>

                <p id="topicIntro"></p>

                <h3>📌 Important Concepts</h3>

                <ul id="concepts"></ul>

                <div id="sectionsContainer"></div>

                <h3>⭐ Important Points for Placements</h3>

                <ul id="importantPoints"></ul>

                <div id="interviewTipsSection">

                    <h3>🎯 Interview Tips</h3>

                    <ul id="interviewTips"></ul>

                </div>

            </div>

        </div>

        <div class="button-area">

            <button onclick="goBack()">
                ← Back to Topic Preparation
            </button>

            <button onclick="goDashboard()">
                🏠 Dashboard
            </button>

        </div>

    </div>

    <script>
// ========================================
// LOGIN PROTECTION
// ========================================

const loggedInUser =
    localStorage.getItem("loggedInUser");

if (!loggedInUser) {
    window.location.href = "login.html";
}
        // ========================================
        // GET COMPANY, ROLE AND TOPIC
        // ========================================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const company =
            params.get("company") ||
            localStorage.getItem("selectedCompany") ||
            "";

        const role =
            params.get("role") ||
            localStorage.getItem("selectedRole") ||
            "";

        const topic =
            params.get("topic") ||
            localStorage.getItem("selectedTopic") ||
            "";

        // ========================================
        // SAVE SELECTION
        // ========================================

        localStorage.setItem(
            "selectedCompany",
            company
        );

        localStorage.setItem(
            "selectedRole",
            role
        );

        localStorage.setItem(
            "selectedTopic",
            topic
        );

        // ========================================
        // DISPLAY INFORMATION
        // ========================================

        document.getElementById(
            "companyTitle"
        ).innerText =
            "🏢 Company: " + company;

        document.getElementById(
            "roleTitle"
        ).innerText =
            "💼 Role: " + role;

        document.getElementById(
            "topicTitle"
        ).innerText =
            "📚 Topic: " + topic;

        document.getElementById(
            "topicDescription"
        ).innerText =
            "Study " +
            topic +
            " for the " +
            role +
            " role at " +
            company +
            ".";

        // ========================================
        // AI NOTES CACHE KEY
        // ========================================

        const aiNotesCacheKey =
            "aiNotes_" +
            company + "_" +
            role + "_" +
            topic;

        // ========================================
        // LOAD AI NOTES
        // ========================================

        async function loadNotes() {

            const loadingMessage =
                document.getElementById(
                    "loadingMessage"
                );

            const notesContent =
                document.getElementById(
                    "notesContent"
                );

            const cachedNotes =
                localStorage.getItem(
                    aiNotesCacheKey
                );

            if (cachedNotes) {

                try {

                    const notes =
                        JSON.parse(
                            cachedNotes
                        );

                    console.log(
                        "Loading notes from cache"
                    );

                    displayNotes(notes);

                    return;

                } catch (error) {

                    console.log(
                        "Invalid cached notes"
                    );

                    localStorage.removeItem(
                        aiNotesCacheKey
                    );

                }

            }

            loadingMessage.style.display =
                "block";

            notesContent.style.display =
                "none";

            try {

                console.log(
                    "Generating AI notes..."
                );

                const url =
                    "/api/generate-notes" +
                    "?topic=" +
                    encodeURIComponent(topic) +
                    "&company=" +
                    encodeURIComponent(company) +
                    "&role=" +
                    encodeURIComponent(role);

                const response =
                    await fetch(url);

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.details ||
                        data.error ||
                        "Unable to generate notes"
                    );

                }

                localStorage.setItem(
                    aiNotesCacheKey,
                    JSON.stringify(data)
                );

                console.log(
                    "AI notes generated successfully"
                );

                displayNotes(data);

            } catch (error) {

                console.log(
                    "AI Notes Error:",
                    error
                );

                loadingMessage.innerText =
                    "⚠️ AI notes unavailable. Loading available notes...";

                loadFallbackNotes();

            }

        }
        // ========================================
        // DISPLAY AI NOTES
        // ========================================

        function displayNotes(notes) {

            document.getElementById(
                "loadingMessage"
            ).style.display = "none";

            document.getElementById(
                "notesContent"
            ).style.display = "block";


            // ========================================
            // TITLE
            // ========================================

            if (notes.title) {

                document.getElementById(
                    "notesTitle"
                ).innerText =
                    "📚 " + notes.title;

            }


            // ========================================
            // INTRODUCTION
            // ========================================

            document.getElementById(
                "topicIntro"
            ).innerText =
                notes.introduction ||
                "No introduction available.";


            // ========================================
            // IMPORTANT CONCEPTS
            // ========================================

            const concepts =
                document.getElementById(
                    "concepts"
                );

            concepts.innerHTML = "";


            if (
                notes.sections &&
                Array.isArray(notes.sections)
            ) {

                notes.sections.forEach(
                    function(section) {

                        if (section.heading) {

                            const li =
                                document.createElement(
                                    "li"
                                );

                            li.innerText =
                                section.heading;

                            concepts.appendChild(
                                li
                            );

                        }

                    }
                );

            }


            // ========================================
            // DETAILED SECTIONS
            // ========================================

            const sectionsContainer =
                document.getElementById(
                    "sectionsContainer"
                );

            sectionsContainer.innerHTML = "";


            if (
                notes.sections &&
                Array.isArray(notes.sections)
            ) {

                notes.sections.forEach(
                    function(section) {

                        const heading =
                            document.createElement(
                                "h3"
                            );

                        heading.innerText =
                            "📖 " +
                            section.heading;


                        const content =
                            document.createElement(
                                "p"
                            );

                        content.innerText =
                            section.content;


                        sectionsContainer.appendChild(
                            heading
                        );

                        sectionsContainer.appendChild(
                            content
                        );

                    }
                );

            }


            // ========================================
            // IMPORTANT POINTS
            // ========================================

            const importantPoints =
                document.getElementById(
                    "importantPoints"
                );

            importantPoints.innerHTML = "";


            if (
                notes.importantPoints &&
                Array.isArray(notes.importantPoints)
            ) {

                notes.importantPoints.forEach(
                    function(item) {

                        const li =
                            document.createElement(
                                "li"
                            );

                        li.innerText =
                            item;

                        importantPoints.appendChild(
                            li
                        );

                    }
                );

            }


            // ========================================
            // INTERVIEW TIPS
            // ========================================

            const interviewTips =
                document.getElementById(
                    "interviewTips"
                );

            interviewTips.innerHTML = "";


            if (
                notes.interviewTips &&
                Array.isArray(notes.interviewTips)
            ) {

                notes.interviewTips.forEach(
                    function(item) {

                        const li =
                            document.createElement(
                                "li"
                            );

                        li.innerText =
                            item;

                        interviewTips.appendChild(
                            li
                        );

                    }
                );

            }

        }

        // ========================================
        // FALLBACK FUNCTION
        // ========================================

        function loadFallbackNotes() {

    const currentNotes =
        topicNotes[topic];

    const notes = currentNotes || {

        intro:
            "These are placement preparation notes for " +
            topic +
            ". Review the important concepts and practice related questions.",

        concepts: [
            topic + " fundamentals",
            "Important concepts and definitions",
            "Common interview questions",
            "Practical applications",
            "Advantages and limitations"
        ],

        importantPoints: [
            "Understand the basic concepts of " + topic + ".",
            "Practice commonly asked placement questions.",
            "Revise important definitions and examples.",
            "Focus on interview-oriented concepts.",
            "Practice coding or problem-solving questions when applicable."
        ]

    };


    document.getElementById(
        "loadingMessage"
    ).style.display = "none";


    document.getElementById(
        "notesContent"
    ).style.display = "block";


    document.getElementById(
        "notesTitle"
    ).innerText =
        "📚 Study Notes";


    document.getElementById(
        "topicIntro"
    ).innerText =
        notes.intro;


    // ========================================
    // DISPLAY CONCEPTS
    // ========================================

    const concepts =
        document.getElementById(
            "concepts"
        );

    concepts.innerHTML = "";


    (notes.concepts || []).forEach(
        function(item) {

            const li =
                document.createElement(
                    "li"
                );

            li.innerText =
                item;

            concepts.appendChild(
                li
            );

        }
    );


    // ========================================
    // DISPLAY IMPORTANT POINTS
    // ========================================

    const importantPoints =
        document.getElementById(
            "importantPoints"
        );

    importantPoints.innerHTML = "";


    (notes.importantPoints || []).forEach(
        function(item) {

            const li =
                document.createElement(
                    "li"
                );

            li.innerText =
                item;

            importantPoints.appendChild(
                li
            );

        }
    );


    // Clear AI-generated sections

    document.getElementById(
        "sectionsContainer"
    ).innerHTML = "";


    document.getElementById(
        "interviewTipsSection"
    ).style.display =
        "none";


    console.log(
        "Fallback notes loaded for:",
        topic
    );

}
        // ========================================
