    window.location.href = "login.html";
}

// GET COMPANY AND ROLE
// =====================================================

    new URLSearchParams(
        window.location.search
    );


const company =
    params.get("company") ||
    localStorage.getItem("selectedCompany") ||
    "";


const role =
    params.get("role") ||
    localStorage.getItem("selectedRole") ||
    "";


if (company) {

    localStorage.setItem(
        "selectedCompany",
        company
    );

}


if (role) {

    localStorage.setItem(
        "selectedRole",
        role
    );

}

// DISPLAY COMPANY AND ROLE
// =====================================================

    "companyTitle"
).innerText =
    company || "Not Selected";


document.getElementById(
    "roleTitle"
).innerText =
    role || "Not Selected";

    "selectionInfo"
).innerText =

    company && role

// =====================================================
// DISPLAY DOMAINS
// =====================================================

function displayDomains(domainList) {

    const container =
        document.getElementById(
            "domainContainer"
        );

    container.innerHTML = "";

    let totalSubjects = 0;


    domainList.forEach(function(domain) {

        totalSubjects +=
            domain.subjects.length;


        const domainSection =
            document.createElement("div");

        domainSection.className =
            "domain-section";


        // DOMAIN HEADER

        const domainHeader =
            document.createElement("div");

        domainHeader.className =
            "domain-header";


        domainHeader.innerHTML =

            "<h2>" +
            domain.icon +
            " " +
            domain.name +
            "</h2>" +

            "<p>" +
            domain.description +
            "</p>";


        domainSection.appendChild(
            domainHeader
        );


        // SUBJECT GRID

        const subjectGrid =
            document.createElement("div");

        subjectGrid.className =
            "subject-grid";


        domain.subjects.forEach(
            function(subject) {

                const subjectCard =
                    document.createElement("div");

                subjectCard.className =
                    "subject-card";


                let topicsHTML = "";


                subject.topics.forEach(
                    function(topic) {

                        topicsHTML +=

                            '<button ' +

                            'class="topic-button" ' +

                            'onclick="openTopic(\'' +

                            escapeQuotes(topic) +

                            '\')">' +

                            topic +

                            "</button>";

                    }
                );


                subjectCard.innerHTML =

                    '<div class="subject-icon">' +
                    subject.icon +
                    "</div>" +

                    "<h3>" +
                    subject.name +
                    "</h3>" +

                    "<p>" +
                    subject.description +
                    "</p>" +

                    '<div class="topic-label">' +
                    "Topics" +
                    "</div>" +

                    '<div class="topic-list">' +
                    topicsHTML +
                    "</div>";


                subjectGrid.appendChild(
                    subjectCard
                );

            }
        );


        domainSection.appendChild(
            subjectGrid
        );


        container.appendChild(
            domainSection
        );

    });


    const noResults =
        document.getElementById(
            "noResults"
        );


    if (totalSubjects === 0) {

        noResults.style.display =
            "block";

    } else {

        noResults.style.display =
            "none";

    }

}


// =====================================================
// ESCAPE QUOTES
// =====================================================

function escapeQuotes(text) {

    return text
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


// =====================================================
// OPEN TOPIC
// =====================================================

function openTopic(topic) {

    if (!company || !role) {

        alert(
            "Please select a company and role first."
        );

        return;
    }


    localStorage.setItem(
        "selectedTopic",
        topic
    );


    window.location.href =
        "topic-preparation.html?company=" +
        encodeURIComponent(company) +
        "&role=" +
        encodeURIComponent(role) +
        "&topic=" +
        encodeURIComponent(topic);

}


// =====================================================
// SEARCH
// =====================================================

function filterTopics() {

    const search =
        document.getElementById("searchBox")
        .value
        .toLowerCase()
        .trim();

    const noResults =
        document.getElementById("noResults");


    // If search box is empty
    if (!search) {

        displayDomains(domains);

        return;
    }


    const filteredDomains = [];


    // Search existing subjects and topics
    domains.forEach(function(domain) {

        const filteredSubjects = [];


        domain.subjects.forEach(function(subject) {

            const subjectMatches =
                subject.name
                    .toLowerCase()
                    .includes(search);


            const descriptionMatches =
                subject.description
                    .toLowerCase()
                    .includes(search);


            const matchingTopics =
                subject.topics.filter(function(topic) {

                    return topic
                        .toLowerCase()
                        .includes(search);

                });


            if (
                subjectMatches ||
                descriptionMatches ||
                matchingTopics.length > 0
            ) {

                filteredSubjects.push({

                    name: subject.name,

                    icon: subject.icon,

                    description:
                        subject.description,

                    topics:
                        subjectMatches ||
                        descriptionMatches
                            ? subject.topics
                            : matchingTopics

                });

            }

        });

        if (filteredSubjects.length > 0) {

            filteredDomains.push({

                name: domain.name,

                icon: domain.icon,

                description:
                    domain.description,

                subjects:
                    filteredSubjects

            });

        }

    });


    // ======================================
    // EXISTING SUBJECT / TOPIC FOUND
    // ======================================

    if (filteredDomains.length > 0) {

        displayDomains(filteredDomains);

        return;
    }


    // ======================================
    // NEW / CUSTOM TOPIC
    // ======================================

    const container =
        document.getElementById("domainContainer");

    container.innerHTML = `

        <div class="subject-card">

            <div class="subject-icon">
                🤖
            </div>

            <h3>${search}</h3>

            <p>
                AI-generated placement preparation
                resources for ${search}.
            </p>

            <br>

            <button
                class="topic-button"
                onclick="openTopicResources('${search.replace(/'/g, "\\'")}')">

                📚 Open Topic Resources

            </button>

        </div>

    `;


    // Hide "No subject or topic found"
    if (noResults) {

        noResults.style.display = "none";

    }

}

// =====================================================

    window.location.href =

}

function openTopicResources(topic) {

    // Save selected topic
    localStorage.setItem(
        "selectedTopic",
        topic
    );

    // Keep the selected company
    const company =
        localStorage.getItem(
            "selectedCompany"
        ) || "";

    // Keep the selected role
    const role =
        localStorage.getItem(
            "selectedRole"
        ) || "";

    // Open Topic Resources
    window.location.href =
        "topic-preparation.html?company=" +
        encodeURIComponent(company) +
        "&role=" +
        encodeURIComponent(role) +
        "&topic=" +
        encodeURIComponent(topic);
}
