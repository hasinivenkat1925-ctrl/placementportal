<!DOCTYPE html>
<html>
<head>
    <title>Placement Portal - Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🎓 Placement Portal</h1>

    <h2>📝 Student Registration</h2>

    <form id="registerForm">

        <label>Name:</label>
        <br>
        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <label>Email:</label>
        <br>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <label>Password:</label>
        <br>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <p id="message"></p>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name: name,
                                    email: email,
                                    password: password
                                })
                            }
                        );

                    const data =
                        await response.json();

                    if (response.ok) {

                        message.innerText =
                            "✅ " + data.message;

                        document
                            .getElementById("registerForm")
                            .reset();

                        setTimeout(function() {

                            window.location.href =
                                "login.html";

                        }, 1500);

                    } else {

                        message.innerText =
                            "❌ " + data.error;

                    }

                } catch (error) {

                    console.log(error);

                    message.innerText =
                        "❌ Unable to connect to server.";

                }

            });

    </script>

</body>
</html>
