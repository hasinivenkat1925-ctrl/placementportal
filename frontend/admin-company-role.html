<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Company & Role Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        .back-btn {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #475569;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .info {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;
        }

        .info h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .summary {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            text-align: center;
        }

        .summary-card h3 {
            color: #1e3a8a;
        }

        .number {
            font-size: 36px;
            font-weight: bold;
            color: #2563eb;
        }

        .company-list {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .company-card {
            background: white;
            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .company-card h2 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .role {
            display: inline-block;

            background: #eff6ff;
            color: #1d4ed8;

            padding: 8px 12px;

            border-radius: 6px;

            margin: 5px;

            font-size: 14px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            header h1 {
                font-size: 21px;
            }

            .summary,
            .company-list {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🏢 Company & Role Management</h1>

    <button
        class="back-btn"
        onclick="goBack()">
        ← Admin Dashboard
    </button>

</header>


<div class="container">


    <div class="info">

        <h2>🏢 Placement Companies & Roles</h2>

        <p>
            View the companies and roles available
            in the Placement Preparation Portal.
        </p>

    </div>


    <div class="summary">


        <div class="summary-card">

            <h3>🏢 Total Companies</h3>

            <div
                class="number"
                id="companyCount">
                6
            </div>

        </div>


        <div class="summary-card">

            <h3>💼 Available Roles</h3>

            <div
                class="number"
                id="roleCount">
                5
            </div>

        </div>


    </div>


    <div
        class="company-list"
        id="companyList">
    </div>


</div>


<script>
    // ========================================
// ADMIN LOGIN PROTECTION
// ========================================

const adminLoggedIn =
    localStorage.getItem("adminLoggedIn");

if (adminLoggedIn !== "true") {
    window.location.href = "admin-login.html";
}


// ========================================
// ADMIN LOGIN CHECK
// ========================================

if (
    localStorage.getItem("adminLoggedIn")
    !== "true"
) {

    window.location.href =
        "admin-login.html";

}


// ========================================
// COMPANIES AND ROLES
// ========================================

const companies = [

    "TCS",

    "Infosys",

    "Wipro",

    "Accenture",

    "Cognizant",

    "NatWest"

];


const roles = [

    "Software Developer",

    "Java Developer",

    "Python Developer",

    "Data Analyst",

    "Tester"

];


// ========================================
// DISPLAY COMPANIES
// ========================================

function displayCompanies() {

    const container =
        document.getElementById(
            "companyList"
        );


    companies.forEach(
        function(company) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "company-card";


            let rolesHTML = "";


            roles.forEach(
                function(role) {

                    rolesHTML += `

                        <span class="role">
                            ${role}
                        </span>

                    `;

                }
            );


            card.innerHTML = `

                <h2>
                    🏢 ${company}
                </h2>

                <p>
                    Available preparation roles:
                </p>

                <div>
                    ${rolesHTML}
                </div>

            `;


            container.appendChild(card);

        }
    );

}


// ========================================
// BACK TO ADMIN DASHBOARD
// ========================================

function goBack() {

    window.location.href =
        "admin-dashboard.html";

}


// ========================================
// START
// ========================================

displayCompanies();


</script>


</body>

</html>
